name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Web (wasm-gc) build: platform-neutral, no desktop window deps.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify installation
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Build (web_wasm, wasm-gc)
        run: moon build web_wasm --target wasm-gc

  # The native path is macOS/Skia only: it needs Cocoa frameworks, and the
  # `app` test pulls wzzc-dev/window whose native prebuild wants Wayland
  # headers that Ubuntu runners lack. Run native test + build on macOS.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify installation
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Test (app, native)
        run: moon test app --target native

      - name: Build (macos_skia, native)
        run: moon build macos_skia --target native
